<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelVibe | AI Wallpapers & Themes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #deff9a;
            --accent: #00ffff;
            --bg-dark: #0a0a0a;
            --card-bg: #161616;
            --text-light: #f5f5f5;
            --text-dim: #a0a0a0;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Urbanist', 'Noto Sans Thai', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- Navigation --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--glass);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .logo span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-light);
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* --- Hero Section --- */
        .hero {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(10,10,10,1)), 
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        .hero h1 {
            font-size: clamp(40px, 8vw, 70px);
            margin-bottom: 20px;
            line-height: 1.1;
        }

        .hero p {
            color: var(--text-dim);
            max-width: 600px;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .search-container {
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 18px 25px;
            border-radius: 50px;
            border: 1px solid var(--glass);
            background: var(--glass);
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .search-container input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(222, 255, 154, 0.2);
        }

        /* --- Filters --- */
        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 40px 5%;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 25px;
            border-radius: 30px;
            background: var(--card-bg);
            border: 1px solid var(--glass);
            color: var(--text-light);
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: black;
            border-color: var(--primary);
        }

        /* --- Wallpaper Grid --- */
        .content-section {
            padding: 20px 5% 100px;
        }

        .wallpaper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--glass);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
        }

        .card-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 1px solid var(--glass);
            background-color: #222;
        }

        .card-body {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info h3 {
            font-size: 18px;
            margin-bottom: 5px;
            text-transform: capitalize;
        }

        .card-info p {
            color: var(--text-dim);
            font-size: 14px;
        }

        .download-btn {
            width: 45px;
            height: 45px;
            background: var(--primary);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: 0.3s;
            color: black;
            text-decoration: none;
        }

        .download-btn:hover {
            background: var(--accent);
            transform: rotate(360deg);
        }

        /* --- Loading State --- */
        .loading-text {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.2rem;
            color: var(--primary);
            padding: 50px;
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 60px 20px;
            border-top: 1px solid var(--glass);
            color: var(--text-dim);
        }

        .social-icons {
            margin-bottom: 20px;
            font-size: 24px;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .wallpaper-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Pixel<span>Vibe</span></div>
        <ul class="nav-links">
            <li><a href="#">หน้าแรก</a></li>
            <li><a href="#">ธีมยอดนิยม</a></li>
            <li><a href="#">AI เจนเนอเรต</a></li>
            <li><a href="#">สนับสนุน</a></li>
        </ul>
        <div class="logo" style="font-size: 20px;"><i class="fa-solid fa-user-circle"></i></div>
    </nav>

    <header class="hero">
        <h1>Vibe Your <span>Screen</span></h1>
        <p>ระบบดึงวอลเปเปอร์อัตโนมัติผ่านสมองกล AI อยากได้แนวไหนเลือกหรือพิมพ์ค้นหาได้เลย!</p>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="พิมพ์สิ่งที่คุณต้องการ แล้วกด Enter... (ภาษาอังกฤษ)">
        </div>
    </header>

    <div class="filters">
        <button class="filter-btn active" onclick="changeCategory('all', this)">ทั้งหมด</button>
        <button class="filter-btn" onclick="changeCategory('minimalist', this)">Minimalist</button>
        <button class="filter-btn" onclick="changeCategory('cyberpunk', this)">Cyberpunk</button>
        <button class="filter-btn" onclick="changeCategory('nature', this)">Nature</button>
        <button class="filter-btn" onclick="changeCategory('space', this)">Space</button>
    </div>

    <main class="content-section">
        <div class="wallpaper-grid" id="wallpaperGrid">
            <div class="loading-text">กำลังเปิดระบบดึงภาพอัจฉริยะ...</div>
        </div>
    </main>

    <footer>
        <div class="social-icons">
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-x-twitter"></i>
            <i class="fa-brands fa-github"></i>
            <i class="fa-brands fa-discord"></i>
        </div>
        <p>© 2025 PixelVibe Wallpapers. ระบบดึงภาพอัตโนมัติ Live API</p>
        <p style="font-size: 12px; margin-top: 10px;">Powered by GitHub Pages & Unsplash API</p>
    </footer>

    <script>
        const grid = document.getElementById('wallpaperGrid');
        const searchInput = document.getElementById('searchInput');

        // ฟังก์ชันสุ่มตัวเลขคำค้นหาเพื่อความหลากหลาย
        const keywords = {
            all: ['wallpaper', 'aesthetic', 'abstract', 'futuristic'],
            minimalist: ['minimalist', 'clean-wallpaper', 'minimal-art'],
            cyberpunk: ['cyberpunk', 'neon-city', 'synthwave'],
            nature: ['landscape', 'mountain', 'forest', 'sea'],
            space: ['galaxy', 'nebula', 'cosmic', 'astronomy']
        };

        // ฟังก์ชันหลักในการดึงรูปภาพจากอินเทอร์เน็ตมาโชว์บนเว็บ
        async function fetchWallpapers(query) {
            grid.innerHTML = '<div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> กำลังดึงรูปภาพสวยๆ มาให้คุณ...</div>';
            
            try {
                let searchTag = query;
                if (keywords[query]) {
                    // สุ่มเลือกคำค้นหาในหมวดหมู่นั้นๆ
                    const list = keywords[query];
                    searchTag = list[Math.floor(Math.random() * list.length)];
                }

                let htmlContent = '';
                
                // ใช้ Source Unsplash ในการดึงรูปแบบสุ่มจำนวน 9 รูปตามคำค้นหา
                for(let i = 1; i <= 9; i++) {
                    const randomId = Math.floor(Math.random() * 1000) + i;
                    const imgUrl = `https://images.unsplash.com/photo-${1500000000000 + randomId}?auto=format&fit=crop&w=800&q=80&sig=${randomId}&q=${searchTag}`;
                    // เผื่อรูปแรกๆ โหลดช้า ใช้ระบบ Fallback ลิงก์ตรงที่เสถียร
                    const finalImg = `https://source.unsplash.com/featured/800x600/?${searchTag}&sig=${randomId}`;
                    
                    htmlContent += `
                        <div class="card">
                            <img src="${imgUrl}" class="card-img" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800'" alt="${searchTag}">
                            <div class="card-body">
                                <div class="card-info">
                                    <h3>${searchTag} Style #${i}</h3>
                                    <p>AI Auto-Curated • 4K UltraHD</p>
                                </div>
                                <a href="${imgUrl}" target="_blank" class="download-btn"><i class="fa-solid fa-arrow-down"></i></a>
                            </div>
                        </div>
                    `;
                }
                
                grid.innerHTML = htmlContent;
            } catch (error) {
                grid.innerHTML = '<div class="loading-text">เกิดข้อผิดพลาดในการดึงข้อมูล กรุณาลองใหม่อีกครั้ง</div>';
            }
        }

        // ระบบกดสลับหมวดหมู่
        function changeCategory(category, button) {
            // สลับไฮไลต์ปุ่มสีเขียว
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            
            // ดึงภาพใหม่ตามหมวดหมู่ที่เลือก
            fetchWallpapers(category);
        }

        // ระบบตรวจจับการพิมพ์ในช่องค้นหา เมื่อกดปุ่ม Enter
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const value = searchInput.value.trim();
                if (value) {
                    fetchWallpapers(value);
                }
            }
        });

        // สั่งให้ทำงานทันทีเมื่อเปิดหน้าเว็บครั้งแรก
        fetchWallpapers('all');
    </script>
</body>
</html>
